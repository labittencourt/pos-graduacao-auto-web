# Suite E2E (Playwright + TypeScript) do Automation Exercise.
#
# Gate de merge: este workflow so REPORTA. Para bloquear merge com falha, ligue a protecao de branch
# no GitHub (Settings > Branches > Require status checks > "e2e"). Nada e ligado sozinho.
#
# Sem retries (playwright.config.ts): instabilidade e diagnosticada na causa, nao mascarada.
# CI=true => 1 worker (MEM-003: o site e publico e compartilhado).

name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      BASE_URL: https://www.automationexercise.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup Java (Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check site access (anti-bot)
        run: node scripts/check-site-access.js

      - name: Run E2E suite
        run: npm test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload traces and screenshots of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
